<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');

const LS=(()=>{const M={};let ok=true;try{localStorage.setItem('kh_t','1');localStorage.removeItem('kh_t')}catch(e){ok=false}
return{getItem:k=>{try{if(ok)return localStorage.getItem(k)}catch(e){}return M[k]==null?null:M[k]},setItem:(k,v)=>{v=String(v);M[k]=v;try{if(ok)localStorage.setItem(k,v)}catch(e){}}}})();
let CFG={N:25,D:1,show:true,tut:true};try{Object.assign(CFG,JSON.parse(LS.getItem('kh_cfg')||'{}'))}catch(e){}

function getTop(){try{const a=JSON.parse(LS.getItem('kh_top')||'[]');return Array.isArray(a)?a.filter(e=>e&&typeof e.R==='number'):[]}catch(e){return[]}}
const CATN={o:'Vanha',p:'Harjoitus',0:'Helppo',1:'Normaali',2:'Vaikea',3:'Mestari'},catK=x=>x.k!=null?x.k:((x.c===undefined||Array.isArray(x.c))?'o':x.c);

const isStd=e=>e.std!=null?!!e.std:((e.df==null||e.df===1)&&(e.N==null||e.N===25)),curStd=()=>CFG.N===25&&CFG.D===1;
const catBest=c=>Math.max(0,...getTop().filter(e=>catK(e)===c&&isStd(e)===curStd()).map(e=>e.R));
const curCat=()=>(typeof MODE!=='undefined'&&MODE==='comp'&&comp)?comp.diff:'p';
function saveTop(e){e.std=curStd();const a=getTop();a.push(e);a.sort((x,y)=>y.R-x.R);const g2=x=>catK(x)+'|'+isStd(x),cnt={},keep=a.filter(x=>{const k=g2(x);cnt[k]=(cnt[k]||0)+1;return cnt[k]<=20}),r=a.filter(x=>g2(x)===g2(e)).indexOf(e)+1;try{LS.setItem('kh_top',JSON.stringify(keep))}catch(_){}return r}
// ---------- yhteiset ennätykset (palvelin -> GitHub) ----------
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getQ(){try{const q=JSON.parse(LS.getItem('kh_q')||'[]');return Array.isArray(q)?q:[]}catch(e){return[]}}

let flushing=false,ALL=null,ALLT=0,ALLERR=false;
async function flushQ(){if(flushing)return;flushing=true;try{for(const e of getQ().slice()){try{const r=await fetch('/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(e)});if(r.ok||r.status===400)setQ(getQ().filter(x=>x.id!==e.id));else break}catch(_){break}}ALL=null}finally{flushing=false}}
function submitScore(e){setQ(getQ().concat([e]));flushQ()}
function detHTML(e){const f=x=>(+x).toFixed(1);let s=`Aika: ${esc(e.d)||'–'}<br>Taso: ${CATN[catK(e)]}`;
 if(e.n)s+=`<br>Pelaaja: ${esc(e.n)}`;
 if(!isStd(e))s+=`<br>Asetukset: ihanne ${esc(e.N)}, kerroin ${esc(e.df)}`;
 if(e.w)s+=`<br>Tuuli: ${f(e.w.s)} m/s (${e.w.h>=0?'vasta':'myötä'} ${f(Math.abs(e.w.h))}, sivu ${f(Math.abs(e.w.c))})`;
 if(e.c)s+=`<br>Juoksu: ${+e.tot} napautusta (ihanne ${+e.N}), sekunneittain ${e.c.map(Number).join(' · ')}`;
 if(e.errs)s+=`<br>Ristiaskeleet: ${e.errs.map(v=>v>=999?'ohi':(v>0?'+':'')+Math.round(v)+' ms').join(', ')}`;
 if(e.dl!=null)s+=`<br>Heittoviiva: ${f(e.dl)} m ennen viivaa`;
 if(e.a!=null)s+=`<br>Kulma: ${f(e.a)}°`;
 if(e.L)s+='<br>Vähennykset: '+Object.entries(e.L).map(([k,v])=>esc(k)+' −'+f(v)).join(', ');
 return s}
function wireRows(){$('tl').querySelectorAll('.r').forEach(r=>r.onclick=()=>{const d=r.nextSibling;d.style.display=d.style.display==='block'?'none':'block'});$('top').style.display='flex'}
const TV={sc:'own',gr:'std',cat:'all'};
function showTop(){const std=TV.gr==='std',all=TV.sc==='all',src=all?(ALL||[]):getTop();
 const a=src.filter(e=>isStd(e)===std&&(TV.cat==='all'||catK(e)===TV.cat)).sort((x,y)=>y.R-x.R).slice(0,20);
 $('tl').innerHTML=(all&&ALLERR?'<p>Ei yhteyttä palvelimeen'+(ALL?' – näytetään vanhat tiedot':'')+'.</p>':'')+(a.length?a.map((e,i)=>`<div class="r"><span>${i+1}. ${all?'<b>'+esc(e.n)+'</b> ':''}<b>${(+e.R).toFixed(2)} m</b>${TV.cat==='all'?' <small>'+CATN[catK(e)]+'</small>':''}</span><small>${esc(e.d)}</small></div><div class="d">${(()=>{try{return detHTML(e)}catch(_){return 'Ei lisätietoja'}})()}</div>`).join(''):(all&&ALLERR&&!ALL?'':'<p>Ei vielä tuloksia tässä luokassa.</p>'));wireRows()}
function openTop(o){Object.assign(TV,o||{});
 const chips=(id,arr,key)=>{const el=$(id);el.innerHTML='';arr.forEach(([v,n])=>{const b=document.createElement('span');b.textContent=n;b.className=TV[key]===v?'on':'';b.onclick=()=>openTop({[key]:v});el.appendChild(b)})};
 $('tt').textContent='🏆 ENNÄTYSTAULUKKO';
 chips('tabs0',[['own','Omat'],['all','Kaikki pelaajat']],'sc');
 chips('tabs1',[['std','Vakioasetukset'],['cus','Muokatut']],'gr');
 chips('tabs',[['all','Kaikki'],['p','Harjoitus'],[0,'Helppo'],[1,'Normaali'],[2,'Vaikea'],[3,'Mestari'],['o','Vanhat']],'cat');
 if(TV.sc==='all'&&(!ALL||Date.now()-ALLT>15000)){
  if(!ALL)$('tl').innerHTML='<p>Ladataan…</p>';$('top').style.display='flex';
  fetch('/scores',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{ALL=Array.isArray(d.items)?d.items:[];ALLT=Date.now();ALLERR=false}).catch(()=>{ALLERR=true}).finally(()=>{if($('top').style.display==='flex'&&TV.sc==='all')showTop()});
  if(ALL)showTop();return}
 showTop()}
$('trophy').onclick=()=>{if(S==='wait')openTop()};
$('tc').onclick=()=>$('top').style.display='none';
best=catBest('p');
const FACTS=['Miesten keihään maailmanennätys on tšekkiläisen Jan Železnýn 98,48 metriä vuodelta 1996.','Miesten keihäs on 2,6–2,7 metriä pitkä ja painaa vähintään 800 grammaa. Naisten keihäs painaa 600 grammaa.','Keihään painopistettä siirrettiin eteenpäin vuonna 1986, koska heitot olivat kasvaneet liian pitkiksi ja vaarallisiksi stadionilla.','Keihäänheitto kuului jo antiikin olympialaisten viisiotteluun.','Matti Järvinen voitti keihäänheiton olympiakultaa Los Angelesissa 1932, ja Suomea on kutsuttu keihäänheiton suurvallaksi.','Huippuheittäjän keihään lähtönopeus on yli 100 km/h.','Heitto mitataan viivasta keihään kärjen ensimmäiseen osumakohtaan, ja kärjen on osuttava maahan ensin.','Ihanteellinen irtilähtökulma on yleensä noin 32–36 astetta, koska keihäs myös liitää ilmavirrassa.','Keihäänheitto on ollut miesten olympialaji vuodesta 1908 ja naisten vuodesta 1932.','Heittäjät hakevat usein lievää vastatuulta, mutta liian voimakas tuuli sotkee keihään lentoradan.'];
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k,sin=Math.sin,cos=Math.cos,PI=Math.PI;
// ---------- kamera ----------
const cam={p:[-46,1.9,7.5],t:[-37,1.2,0]};let bf,br,bu;
const nrm=v=>{const l=Math.hypot(...v);return v.map(x=>x/l)},crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function look(){bf=nrm(cam.t.map((v,i)=>v-cam.p[i]));br=nrm(crs(bf,[0,1,0]));bu=crs(br,bf)}
function P(x,y,z){const d=[x-cam.p[0],y-cam.p[1],z-cam.p[2]],dz=dot(d,bf);if(dz<.15)return null;return[OX+F*dot(d,br)/dz,OY-F*dot(d,bu)/dz,dz]}
function cp(pts,ax,lim,gt){const o=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],ia=gt?a[ax]>=lim:a[ax]<=lim,ib=gt?b[ax]>=lim:b[ax]<=lim;if(ia)o.push(a);if(ia!==ib){const k=(lim-a[ax])/(b[ax]-a[ax]);o.push([a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k])}}return o}
function quad(pts,col){const q=pts.map(p=>{const d=[p[0]-cam.p[0],p[1]-cam.p[1],p[2]-cam.p[2]];return[dot(d,br),dot(d,bu),dot(d,bf)]}),o=[];
 for(let i=0;i<q.length;i++){const a=q[i],b=q[(i+1)%q.length],ia=a[2]>=.15,ib=b[2]>=.15;if(ia)o.push(a);if(ia!==ib){const k=(.15-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,.15])}}
 if(o.length<3)return;let r=o.map(p=>[OX+F*p[0]/p[2],OY-F*p[1]/p[2]]);
 r=cp(r,0,-W,1);r=cp(r,0,2*W,0);r=cp(r,1,-H,1);r=cp(r,1,2*H,0);if(r.length<3)return;
 g.fillStyle=col;g.beginPath();r.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.fill()}
function seg(a,b,w,col){const A=P(...a),B=P(...b);if(!A||!B)return;g.strokeStyle=col;g.lineWidth=cl(w*F/((A[2]+B[2])/2),1,70);g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(B[0],B[1]);g.stroke()}
// ---------- tila ----------
let OX=0,OY=0,MODE='menu',COL,comp=null,aiMode=null,aiT0=0,fw=[],fwOn=false,winf,S='menu',now=0,dt=0,tt=0,waitT0=0,wOff=Math.random()*50,W4=[1,2,3,4].map(()=>Math.random()*6),wnd,windLoss=0,taps=[],runT0=0,pos=-40,phi=0,spd=0,steps=[],stepT0=0,p0=0,relT0=0,hold=false,holdT0=0,ang=33,thrT0=0,fly=null,res=null,parts=[],floats=[],landT=0,shown=0,heldAng=33,relX=0,lastNow=0,resT0=0,intro=null;

const wcol=l=>`hsl(${Math.round(125*(1-cl(l/3.8,0,1)))},85%,50%)`;
const wlab=l=>l<.5?'OPTIMI':l<1.5?'HYVÄ':l<3?'KOHTALAINEN':'HUONO';
function startIntro(t,s,fn){if(!CFG.tut){fn();return}intro={t,s,fn,start:now,end:now+2.4}}
function reset(){COL=PROF;best=catBest(curCat());W4=[1,2,3,4].map(()=>Math.random()*6);wOff=Math.random()*50;intro=null;S='wait';pos=START;phi=0;spd=0;taps=[];hold=false;fly=null;res=null;thrown=0;waitT0=now;parts=[];floats=[];cam.p=[pos-6.5,1.9,7.5];cam.t=[pos+3.5,1.2,0]}

// ---------- syöte ----------
function down(){
 if(intro)return;
 if(S==='menu'||S==='aiwait')return;if(S==='ai'){compStep();return}if(S==='fin'){finTap();return}
 if(S==='wait'){windLoss=wnd.loss;winf={s:wnd.s,h:wnd.h,c:wnd.c};startIntro('JUOKSU','Naputa tasaisessa tahdissa – tasaisuus ratkaisee',()=>{runT0=now;taps=CFG.tut?[]:[now];S='run'})}
 else if(S==='run'){taps.push(now)}
 else if(S==='steps'){for(const s of steps){if(s.err==null&&now>s.t-.8&&now<s.t+.45){s.err=(now-s.t)*1000;floats.push({t:now,x:s.x,y:s.y-60,s:(s.err>0?'+':'')+Math.round(s.err)+' ms',c:Math.abs(s.err)<60?'#7CFC00':Math.abs(s.err)<150?'#ffd23f':'#ff5a5a'});break}}}
 else if(S==='rel'&&!hold){hold=true;holdT0=now}

}

function endRun(){

 taps.forEach(t=>{const b=Math.floor(t-runT0);if(b>=0&&b<5){c[b]++;tot++}});
 const dev=Math.abs(tot-N)/N,ev=c.reduce((a,x)=>a+Math.abs(x-r),0);
 res={Lrun:(Math.min(16,40*dev)+Math.min(12,1.2*ev))*CFG.D,tot,c};
 startIntro('RISTIASKELEET','Napauta, kun rengas sulkeutuu',()=>{p0=Math.min(pos,-GAP-1.5);stepT0=now;steps=[0,1,2].map(i=>({t:now+1+i*.85,x:W*(i%2?.7:.3),y:H*.42,err:null}));S='steps'});
}
